name: Deploy to Hostinger

on:
  push:
    branches:
      - staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy with retry
        run: |
          for i in 1 2 3; do
            echo "Deployment attempt $i..."
            ssh -i ~/.ssh/deploy_key \
                -p ${{ secrets.HOSTINGER_PORT }} \
                -o ConnectTimeout=30 \
                -o StrictHostKeyChecking=no \
                ${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_HOST }} \
                "cd /home/u420563260/domains/markupmarvel.com/public_html/backend/wp-content/themes/markupmarvel && git fetch origin staging && git reset --hard origin/staging" && echo "Deployed successfully." && exit 0
            echo "Attempt $i failed. Waiting 15s before retry..."
            sleep 15
          done
          echo "All 3 attempts failed."
          exit 1
